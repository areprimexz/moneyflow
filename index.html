<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FLUX FINANCE — cryptocurrency portfolio and trading terminal." />
    <meta name="theme-color" content="#080B10" />
    <title>FLUX FINANCE</title>
    <script>
      try {
        var t = localStorage.getItem("flux.theme");
        var d = localStorage.getItem("flux.density");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (d === "compact" || d === "comfortable") document.documentElement.setAttribute("data-density", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
